    <script>
      // ===================== JEU DE BOWLING =====================
      AFRAME.registerComponent('single-frame-bowling', {
        init: function () {
          this.throwCount = 0;
          this.strike = false;
          this.pins = Array.from(document.querySelectorAll('.pin'));
          this.fallenThreshold = 0.5;

          // Écoute collision sur chaque quille
          this.tick = () => {
            if (this.throwCount === 0) return; // ne rien faire avant le premier lancer
          
            this.pins.forEach(pin => {
              if (!pin.classList.contains('fallen')) {
                const rotation = pin.object3D.rotation;
                const xRot = Math.abs(rotation.x);
                const zRot = Math.abs(rotation.z);
          
                if (xRot > this.fallenThreshold || zRot > this.fallenThreshold) {
                  pin.classList.add('fallen');
                  this.updateScore();
          
                  // faire disparaître la quille après 1 seconde
                  setTimeout(() => {
                    pin.setAttribute('visible', 'false');
                  }, 600);
                }
              }
            });
          };
        },

        updateScore: function () {
          const activePins = this.pins.filter(p => p.getAttribute('visible') === true);
          const fallenCount = activePins.filter(p => p.classList.contains('fallen')).length;
          document.querySelector('#scoreText').setAttribute('value', `Score: ${fallenCount}`);
          document.querySelector('#throwText').setAttribute('value', `Throw: ${this.throwCount}/2`);
      
          if (fallenCount === this.pins.length && this.throwCount >= 1) {
            this.strike = true;
            this.endFrame();
          } else if (this.throwCount >= 2) {
            this.endFrame();
          }
        },

        endFrame: function () {
          console.log(this.strike ? 'STRIKE!' : 'Frame terminée');
          setTimeout(() => this.resetFrame(), 5000);
        },

        resetFrame: function () {
          document.querySelectorAll('.grabbable').forEach(ball => {
            if (!ball.body) return;
            const start = ball.getAttribute('data-start-pos').split(' ');
            ball.body.velocity.set(0,0,0);
            ball.body.angularVelocity.set(0,0,0);
            ball.body.position.set(parseFloat(start[0]), parseFloat(start[1]), parseFloat(start[2]));
            ball.object3D.position.set(parseFloat(start[0]), parseFloat(start[1]), parseFloat(start[2]));
            ball.object3D.rotation.set(0,0,0);
          });

          document.querySelectorAll('.pin').forEach(pin => {
            pin.classList.remove('fallen');
            pin.setAttribute('visible', 'true');
            pin.body.velocity.set(0, 0, 0);
            pin.body.angularVelocity.set(0, 0, 0);
            const pos = pin.getAttribute('data-start-pos').split(' ');
            pin.body.position.set(parseFloat(pos[0]), parseFloat(pos[1]), parseFloat(pos[2]));
            pin.object3D.position.set(parseFloat(pos[0]), parseFloat(pos[1]), parseFloat(pos[2]));
            pin.object3D.rotation.set(0, 0, 0);
          });

          this.throwCount = 0;
          this.strike = false;
          document.querySelector('#scoreText').setAttribute('value', 'Score: 0');
          document.querySelector('#throwText').setAttribute('value', 'Throw: 0/2');
        }
      });

      // ===================== GRAB & LANCER =====================
      AFRAME.registerComponent('grabbygrip', {
        init: function (){
          this.system = this.el.sceneEl.systems.physics;
          this.GRABBED_STATE = 'grabbed';
          this.grabbing = false;
          this.hitEl = null;
          this.constraint = null;
          this.lastPos = new THREE.Vector3();
          this.lastRot = new THREE.Vector3();
          this.handVel = new THREE.Vector3();
          this.handAngVel = new THREE.Vector3();

          this.onHit = this.onHit.bind(this);
          this.onGripOpen = this.onGripOpen.bind(this);
          this.onGripClose = this.onGripClose.bind(this);
        },

        tick: function () {
          const pos = this.el.object3D.position;
          this.handVel.subVectors(pos, this.lastPos);
          this.lastPos.copy(pos);

          const rot = this.el.object3D.rotation;
          this.handAngVel.subVectors(rot, this.lastRot);
          this.lastRot.copy(rot);
        },

        play: function() {
          const el = this.el;
          el.addEventListener('hit', this.onHit);
          el.addEventListener('gripdown', this.onGripClose);
          el.addEventListener('gripup', this.onGripOpen);
        },

        pause: function() {
          const el = this.el;
          el.removeEventListener('hit', this.onHit);
          el.removeEventListener('gripdown', this.onGripClose);
          el.removeEventListener('gripup', this.onGripOpen);
        },

        onGripClose: function() {
          this.grabbing = true;
        },

        onGripOpen: function() {
          const hitEl = this.hitEl;
          this.grabbing = false;
          if (!hitEl) return;
        
          if (this.constraint) {
            this.system.removeConstraint(this.constraint);
            this.constraint = null;
          }
          hitEl.removeState(this.GRABBED_STATE);
        
          // --- Calcule la direction avant de la main ---
          const forward = new THREE.Vector3(0, 0, -1);
          forward.applyQuaternion(this.el.object3D.quaternion);
          forward.normalize();
        
          // --- On réduit la déviation latérale ---
          // On veut que le lancer soit presque tout droit vers Z
          const lateralReduction = 0.3; // 0 = 100% libre, 1 = parfaitement droit
          forward.x *= (1 - lateralReduction);
          forward.normalize();
        
          // --- Force de lancer ---
          const power = 12;
          const throwVelocity = forward.multiplyScalar(power);
        
          // --- Applique la vitesse sur la boule ---
          hitEl.body.velocity.set(throwVelocity.x, this.handVel.y * 6, throwVelocity.z);
        
          // --- Effet de rotation doux ---
          hitEl.body.angularVelocity.set(
            this.handAngVel.x * 2,
            this.handAngVel.y * 2,
            this.handAngVel.z * 2
          );

          const game = document.querySelector('[single-frame-bowling]').components['single-frame-bowling'];
          if (game) {
            game.throwCount++;
            game.throwActive = true;
            document.querySelector('#throwText').setAttribute('value', `Throw: ${game.throwCount}/2`);

            if (game.throwCount >= 2) {
              game.endFrame();
            }
          }
          this.hitEl = null;
          this.el.emit('ball-thrown', { ball: hitEl });
        },

        onHit: function (e) {
          const hitEl = e.detail.body ? e.detail.body.el : e.detail.el;
          if (!this.grabbing || hitEl === this.el || hitEl.is(this.GRABBED_STATE)) return;

          this.hitEl = hitEl;
          hitEl.addState(this.GRABBED_STATE);
          this.constraint = new CANNON.LockConstraint(this.el.body, hitEl.body);
          this.system.addConstraint(this.constraint);
          hitEl.emit('grab-start');
        }
      });

      // ===================== MENU DES NIVEAUX =====================
      const rightHand = document.querySelector('#rightHand');
      const buttons = document.querySelectorAll('.menu-button');
      const level1map = document.querySelector('#level1map');
      const level2map = document.querySelector('#level2map');
      const level3map = document.querySelector('#level3map');

      buttons.forEach(btn => {
        btn.addEventListener('mouseenter', () => btn.setAttribute('color', '#FFD700'));
        btn.addEventListener('mouseleave', () => {
          if (btn.id === 'level1') btn.setAttribute('color', '#4CAF50');
          else if (btn.id === 'level2') btn.setAttribute('color', '#2196F3');
          else if (btn.id === 'level3') btn.setAttribute('color', '#f44336');
        });
      });

      function handleSelect() {
        const hits = rightHand.components.raycaster.intersections;
        if (hits.length > 0) {
          const target = hits[0].object.el;
      
          const levels = [
            {el: level1map, id: 'level1'},
            {el: level2map, id: 'level2'},
            {el: level3map, id: 'level3'}
          ];
      
          levels.forEach(level => {
            const isActive = target.id === level.id;
            level.el.setAttribute('visible', isActive);
      
            level.el.querySelectorAll('.pin').forEach(pin => {
              if (!pin.body) return;
      
              if (isActive) {
                // Réinitialiser la physique
                const pos = pin.getAttribute('data-start-pos').split(' ');
                pin.body.position.set(parseFloat(pos[0]), parseFloat(pos[1]), parseFloat(pos[2]));
                pin.body.velocity.set(0, 0, 0);
                pin.body.angularVelocity.set(0, 0, 0);
                pin.body.collisionFilterGroup = 1;
                pin.object3D.position.set(parseFloat(pos[0]), parseFloat(pos[1]), parseFloat(pos[2]));
                pin.object3D.rotation.set(0, 0, 0);
              } else {
                // Désactiver collisions et arrêter le corps
                pin.body.velocity.set(0, 0, 0);
                pin.body.angularVelocity.set(0, 0, 0);
                pin.body.collisionFilterGroup = 0;
              }
            });
          });
        }
      }

      rightHand.addEventListener('triggerdown', handleSelect);
      rightHand.addEventListener('abuttondown', handleSelect);
    </script>
  </body>
</html>
